[project]
name = "agentv2"
version = "0.1.0"
description = "rimagent v2: plays RimWorld through RimBridge, built on Pydantic AI Harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]==2.47.0",
    "pydantic-ai-harness[skills,code-mode]==0.33.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "httpx>=0.28",
]

[project.scripts]
agentv2 = "agentv2.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
